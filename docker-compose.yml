services:
  postgres:
    image: postgres:17
    container_name: ai-support-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prasad123
      POSTGRES_DB: ai_support_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai_support_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: ai-support-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: